name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release gates
        run: |
          pnpm check:action-pins
          env -u TYPESAFE_API_KEY pnpm check:boundaries
          env -u TYPESAFE_API_KEY pnpm check:public-recordings
          node scripts/release-check-key-free-build.mjs
          env -u TYPESAFE_API_KEY pnpm test
          env -u TYPESAFE_API_KEY pnpm typecheck
          env -u TYPESAFE_API_KEY pnpm build
          pnpm check:artifact
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static application only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
